apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reostream
  namespace: smart-home
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1h
  values:
    controllers:
      app:
        pod:
          nodeSelector:
            "tam.land/tpu.present": "true"
          tolerations:
            - key: "tam.land/peripheralNode"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
        containers:
          app:
            image:
              repository: ghcr.io/volttech21/reostream
              tag: 0.1.11
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /api/status
                port: 8560
              readiness:
                enabled: true
                type: HTTP
                path: /api/status
                port: 8560
              startup:
                enabled: true
                type: HTTP
                path: /api/status
                port: 8560
    ingress:
      app:
        enabled: true
        hosts:
          - host: "reostream.local.tam.land"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: local-tamland-tls
            hosts:
              - reostream.local.tam.land
    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: 8562
            primary: true
          rtsp:
            port: 8561
            protocol: TCP
    persistence:
      data:
        type: nfs
        server: nfs.local.tam.land
        path: /nfs-share/smart-home/reostream/data
        advancedMounts:
          app:
            app:
              - path: /data
