      podSelector: app.kubernetes.io/instance=calibre-web-automated,app.kubernetes.io/controller=app
      widget:
        type: calibreweb
        url: http://calibre-web-automated.media.svc.cluster.local:8083
        username: "{{HOMEPAGE_VAR_CALIBRE_USERNAME}}"
        password: "{{HOMEPAGE_VAR_CALIBRE_PASSWORD}}"
