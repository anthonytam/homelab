# API credentials are substituted by Homepage at runtime from homepage-widget-secrets.
# ClusterIP URLs are for widgets; browser links use the existing ingress hosts.
- Media:
  - Jellyfin:
      icon: jellyfin.png
      description: Movies and television
      href: https://jellyfin.tam.land
      namespace: media
      app: jellyfin
      podSelector: app.kubernetes.io/instance=jellyfin,app.kubernetes.io/controller=app
      widget:
        type: jellyfin
        url: http://jellyfin.media.svc.cluster.local:8096
        key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
        enableBlocks: true
        enableNowPlaying: false
        enableMediaControl: false
  - Seerr:
      icon: jellyseerr.png
      description: Media requests
      href: https://request.tam.land
