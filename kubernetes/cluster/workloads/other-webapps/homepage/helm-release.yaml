apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: other-webapps
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: flux-system
      interval: 1h
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: v2.8.0
    enableRbac: true
    serviceAccount:
      name: homepage-app
      create: true
    ingress:
      main:
        enabled: true
        hosts:
          - host: home.tam.land
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: tamland-tls
            hosts:
              - home.tam.land
    config:
      # Kustomize replaces this with the generated ConfigMap's content hash.
      useExistingConfigMap: homepage-config
    envFrom:
      - secretRef:
          name: homepage-widget-secrets
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: home.tam.land
      - name: TZ
        value: America/Toronto
