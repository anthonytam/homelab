---
apiVersion: v1
kind: Secret
metadata:
  name: local-tamland-tls
  namespace: admin
  annotations:
    secret-sync/sync-enabled: "true"
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "local-tamland-cert"
  namespace: admin
spec:
  secretName: "local-tamland-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "local.tam.land"
  dnsNames:
    - "local.tam.land"
    - "*.local.tam.land"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: local-tamland-tlsstore
  namespace: admin
spec:
  defaultCertificate:
    secretName: "local-tamland-tls"
---
apiVersion: homerow.ca/v1
kind: SyncSecret
metadata:
  name: local-tamland-tls-secret
spec:
  secret:
    name: local-tamland-tls
    namespace: admin
  destinationNamespaces:
    - 3d-printing
    - media
    - monitoring
    - openclaw
    - other-webapps
    - platform
    - smart-home