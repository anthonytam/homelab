apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: grafana-community-loki
    namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: loki-configuration
      valuesKey: accessKeyId
      targetPath: loki.storage.s3.accessKeyId
    - kind: Secret
      name: loki-configuration
      valuesKey: secretAccessKey
      targetPath: loki.storage.s3.secretAccessKey
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      pattern_ingester:
        enabled: true
        lifecycler:
          ring:
            replication_factor: 1
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
        retention_period: 90d
      compactor:
        retention_enabled: true
        delete_request_store: s3
      querier:
        max_concurrent: 4
      storage:
        type: s3
        bucketNames:
            chunks: loki-prd-chunks
            ruler: loki-prd-ruler
            admin: loki-prd-admin
        s3:
          endpoint: http://garage-s3.admin.svc.cluster.local:3900
          region: garage
          signatureVersion: v4
          s3ForcePathStyle: true
          insecure: true
    gateway:
      metrics:
        service:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "4040"
            prometheus.io/path: "/metrics"
    deploymentMode: Monolithic
    singleBinary:
      replicas: 1
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: "/metrics"
      persistence:
        enabled: true
        storageClass: proxmox-data-ssd-array
        accessModes:
          - ReadWriteOnce
        size: 20Gi
        enableStatefulSetAutoDeletePVC: false
        whenDeleted: Retain
        whenScaled: Retain
    lokiCanary:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3500"
        prometheus.io/path: "/metrics"
    chunksCache:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9150"
        prometheus.io/path: "/metrics"
    resultsCache:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9150"
        prometheus.io/path: "/metrics"
    
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0
    minio:
      enabled: false