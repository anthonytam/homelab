          type: gauge
          help: Capacity in allocation units; multiply by the matching AllocationUnits.
          indexes:
          - labelname: zvolIndex
            type: gauge
          lookups:
          - labels:
            - zvolIndex
            labelname: zvolDescr
            oid: 1.3.6.1.4.1.50536.1.3.1.1.2
            type: DisplayString
        - name: zvolUsed
          oid: 1.3.6.1.4.1.50536.1.3.1.1.5
          type: gauge
