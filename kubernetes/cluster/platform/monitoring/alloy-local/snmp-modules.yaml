# hpe_comware: ENTITY-MIB and HH3C-ENTITY-EXT-MIB, HPE 5130 EI companion:
# https://arubanetworking.hpe.com/techdocs/comware/MIB_files/HPE5130EICmwr7MIBCompanion.pdf
# hpe_comware_poe: RFC 3621 POWER-ETHERNET-MIB and HH3C-POWER-ETH-EXT-MIB:
# https://www.h3c.com/en/d_202603/2774558_294551_0.htm
# https://wwwsg.h3c.com/en/d_202603/2773995_294551_0.htm
# PoE support must be verified on each firmware. Retain its two-part port index;
# it is not an IF-MIB ifIndex. Raw private PoE power readings are milliwatts.
# TrueNAS CORE 13.0-U6.8, FREENAS-MIB (not the SCALE TRUENAS-MIB).
# Source revision: truenas/middleware 5021f909d2f5476f918a185d87d66b958477028f
# MIB: src/freenas/usr/local/share/snmp/mibs/FREENAS-MIB.txt
# Units/counter semantics checked against src/freenas/usr/local/bin/snmp-agent.py.
# TrueNAS physical-disk temperatures, SMART, and errors belong to HypeStore.
# hpe_ilo4 uses the pinned Alloy v1.16.3 HPE definitions plus CPQHLTH-MIB,
# CPQSM2-MIB and CPQIDA-MIB from HPE's upd11.85mib.tar.gz archive:
# https://downloads.hpe.com/pub/softlib2/software1/pubsw-linux/p1580676047/v229101/upd11.85mib.tar.gz
# SHA256: be18d3977d62d24f5ac049168fb3bf8b73b19dc3180bc710781d2d9ec2f34a2c
# Only selected scalar/column OIDs are requested; no full enterprise walk.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-local-snmp-modules
  namespace: monitoring
data:
  modules.yml: |
    modules:
      truenas_core13:
