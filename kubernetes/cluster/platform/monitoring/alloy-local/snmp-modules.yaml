          indexes:
          - labelname: datasetIndex
            type: gauge
          lookups:
          - labels:
            - datasetIndex
            labelname: datasetDescr
            oid: 1.3.6.1.4.1.50536.1.2.1.1.2
            type: DisplayString
        - name: datasetUsed
          oid: 1.3.6.1.4.1.50536.1.2.1.1.5
