            type: DisplayString
        - name: zpoolWriteBytes
          oid: 1.3.6.1.4.1.50536.1.1.1.1.11
          type: counter
          help: Cumulative logical pool bytes written since import/boot.
          indexes:
          - labelname: zpoolIndex
            type: gauge
          lookups:
          - labels:
            - zpoolIndex
            labelname: zpoolDescr
            oid: 1.3.6.1.4.1.50536.1.1.1.1.2
            type: DisplayString
        - name: datasetAllocationUnits
          oid: 1.3.6.1.4.1.50536.1.2.1.1.3
          type: gauge
          help: Bytes per allocation unit.
          indexes:
          - labelname: datasetIndex
            type: gauge
          lookups:
          - labels:
            - datasetIndex
            labelname: datasetDescr
            oid: 1.3.6.1.4.1.50536.1.2.1.1.2
            type: DisplayString
        - name: datasetSize
