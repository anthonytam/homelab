        - name: truenas_zfs_arc_size_bytes
          oid: 1.3.6.1.4.1.50536.1.4.1
          type: gauge
          help: ARC size in bytes; CORE 13 agent reports KiB.
          scale: 1024
        - name: truenas_zfs_arc_metadata_bytes
          oid: 1.3.6.1.4.1.50536.1.4.2
          type: gauge
          help: ARC metadata in bytes; CORE 13 agent reports KiB.
          scale: 1024
        - name: truenas_zfs_arc_data_bytes
          oid: 1.3.6.1.4.1.50536.1.4.3
          type: gauge
          help: ARC data in bytes; CORE 13 agent reports KiB.
          scale: 1024
        - name: truenas_zfs_arc_target_bytes
          oid: 1.3.6.1.4.1.50536.1.4.6
          type: gauge
          help: ARC target in bytes; CORE 13 agent reports KiB.
          scale: 1024
        - name: truenas_zfs_arc_mru_target_bytes
          oid: 1.3.6.1.4.1.50536.1.4.7
          type: gauge
          help: ARC mru target in bytes; CORE 13 agent reports KiB.
          scale: 1024
        - name: truenas_zfs_arc_hits_total
          oid: 1.3.6.1.4.1.50536.1.4.4
          type: counter
          help: Cumulative ARC hits; the CORE 13 agent wraps this value at 2^32.
        - name: truenas_zfs_arc_misses_total
          oid: 1.3.6.1.4.1.50536.1.4.5
          type: counter
          help: Cumulative ARC misses; the CORE 13 agent wraps this value at 2^32.
        - name: truenas_zfs_arc_miss_percent
          oid: 1.3.6.1.4.1.50536.1.4.8
          type: DisplayString
          help: ARC miss percentage (0-100), parsed from the CORE agent string.
          regex_extracts:
            '':
            - regex: ([0-9]+(?:\.[0-9]+)?)
              value: $1
        - name: truenas_zfs_arc_cache_hit_percent
          oid: 1.3.6.1.4.1.50536.1.4.9
          type: DisplayString
          help: ARC cache hit percentage (0-100), parsed from the CORE agent string.
          regex_extracts:
            '':
            - regex: ([0-9]+(?:\.[0-9]+)?)
              value: $1
        - name: truenas_zfs_arc_cache_miss_percent
          oid: 1.3.6.1.4.1.50536.1.4.10
          type: DisplayString
          help: ARC cache miss percentage (0-100), parsed from the CORE agent string.
          regex_extracts:
            '':
            - regex: ([0-9]+(?:\.[0-9]+)?)
              value: $1
        - name: truenas_zfs_l2arc_size_bytes
          oid: 1.3.6.1.4.1.50536.1.5.5
          type: gauge
          help: L2ARC size in bytes; CORE 13 agent reports KiB.
          scale: 1024
