apiVersion: v1
kind: Service
metadata:
  name: alloy-local-ingest
  namespace: monitoring
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.200.12.12
spec:
  type: LoadBalancer
  # Preserve appliance source addresses, including for UDP syslog.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy-local
  ports:
    - name: syslog-bsd-tcp
      port: 514
      targetPort: syslog-bsd-tcp
      protocol: TCP
    - name: syslog-bsd-udp
      port: 514
      targetPort: syslog-bsd-udp
      protocol: UDP
    - name: syslog-ietf-tcp
      port: 1514
      targetPort: syslog-ietf-tcp
      protocol: TCP
    - name: syslog-ietf-udp
      port: 1514
      targetPort: syslog-ietf-udp
      protocol: UDP
    - name: loki-push
      port: 3100
      targetPort: loki-push
      protocol: TCP
    - name: prom-write
      port: 9999
      targetPort: prom-write
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
