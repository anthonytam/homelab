apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-gateway-config
  namespace: monitoring
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    // Destinations
    loki.write "tamland_loki" {
      endpoint {
        name = "tamland-loki"
        url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
      }
    }

    prometheus.remote_write "tamland" {
      endpoint {
        url = "http://prometheus-server.monitoring.svc.cluster.local/api/v1/write"
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.monitoring.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }

    // Remote-site Alloy collectors supply their own site labels. Preserve them
    // and the original log timestamps, including logs queued during WAN outages.
    loki.source.api "remote_sites" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 3100
      }
      use_incoming_timestamp = true
      forward_to = [loki.write.tamland_loki.receiver]
    }

    prometheus.receive_http "remote_sites" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 9999
      }
      forward_to = [prometheus.remote_write.tamland.receiver]
    }

    // Local Kubernetes events retain their own thebridge site label.
    import.file "kubernetes" {
      filename = "/etc/alloy/kubernetes-events.alloy"
    }

    kubernetes.events "tamland" {
      cluster = "tamland"
      site    = "thebridge"
      forward_to = [
        loki.write.tamland_loki.receiver,
      ]
    }

  kubernetes-events.alloy: |
    declare "events" {
      argument "cluster" {
        optional = false
        comment  = "Cluster name added to Kubernetes event logs."
      }

      argument "site" {
        optional = false
        comment  = "Site name added to Kubernetes event logs."
      }

      argument "forward_to" {
        optional = false
        comment  = "Loki receivers to forward processed events to."
      }

      loki.source.kubernetes_events "source" {
        job_name   = "kubernetes/events"
        log_format = "logfmt"

        forward_to = [
          loki.process.events.receiver,
        ]
      }

      loki.process "events" {
        stage.static_labels {
          values = {
            cluster = argument.cluster.value,
            site    = argument.site.value,
            source  = "kubernetes-event",
          }
        }

        forward_to = argument.forward_to.value
      }
    }
