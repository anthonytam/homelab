apiVersion: v1
kind: Service
metadata:
  name: alloy-gateway-ingest
  namespace: monitoring
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.200.12.13
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy-gateway
  ports:
    - name: loki-push
      port: 3100
      targetPort: loki-push
      protocol: TCP
    - name: prom-write
      port: 9999
      targetPort: prom-write
      protocol: TCP
