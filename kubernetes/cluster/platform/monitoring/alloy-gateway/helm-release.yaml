apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-gateway
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: 1.9.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  values:
    alloy:
      configMap:
        create: false
        name: alloy-gateway-config
        key: config.alloy
      storagePath: /var/lib/alloy
      mounts:
        extra:
          - name: allow-gateway-data
            mountPath: /var/lib/alloy
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    controller:
      type: deployment
      replicas: 1
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
        prometheus.io/path: "/metrics"
      volumes:
        extra:
          - name: allow-gateway-data
            persistentVolumeClaim:
              claimName: alloy-gateway-data