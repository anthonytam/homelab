apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: tempo
      version: 1.24.4
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  values:
    tempo:
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3200"
      prometheus.io/path: "/metrics"
    persistence:
      enabled: true
      storageClassName: proxmox-data-ssd-array
      accessModes:
        - ReadWriteOnce
      size: 50Gi
      enableStatefulSetAutoDeletePVC: false